name: CI / Gold Version Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Code Integrity, Security & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: AST & Bytecode Syntax Compilation Check (Zero Syntax/Indent Errors)
        run: |
          python -m py_compile app.py
          python -m py_compile $(git ls-files '*.py')

      - name: Security Scan (Secret & API Key Leak Prevention)
        run: |
          # Verify no committed active secrets in tracked repository files
          ! grep -rE "(gsk_[a-zA-Z0-9]{30,}|sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{20,}|github_pat_[a-zA-Z0-9]{20,})" \
            --exclude-dir=".git" --exclude-dir=".venv" --exclude-dir="__pycache__" .

      - name: Run Test Suite (52 Deterministic Tests)
        run: |
          pytest tests/ -v --durations=10
